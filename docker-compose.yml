
# NOTE: The 'web' (Next.js) service is intentionally NOT listed here.
# It is deployed separately to Vercel (serverless) and communicates with
# app-api and hooks-api over HTTPS. See §17 of the design document.
# Run the web app locally with: cd apps/web && pnpm dev


services:
  # ─── Infrastructure ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: zapier_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zapier_clone
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zapier_redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Kafka in KRaft mode — no Zookeeper
  # IMPORTANT: Two listeners are required for Docker networking:
  #   INTERNAL  — used by relay/worker containers (kafka:9092)
  #   EXTERNAL  — used by host-side tooling like kafka-topics.sh (localhost:9093)
  kafka:
    image: bitnami/kafka:3.7
    container_name: zapier_kafka
    ports:
      - '9093:9093'   # Expose EXTERNAL listener to host for dev tooling
    environment:
      # KRaft settings
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      # Listeners — INTERNAL for containers, EXTERNAL for host tooling, CONTROLLER for KRaft
      KAFKA_CFG_LISTENERS: INTERNAL://:9092,EXTERNAL://:9093,CONTROLLER://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Topic defaults
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_CFG_NUM_PARTITIONS: 4
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 1
      ALLOW_PLAINTEXT_LISTENER: 'yes'
    healthcheck:
      test: ['CMD-SHELL', 'kafka-topics.sh --bootstrap-server kafka:9092 --list || exit 1']
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ─── Application Services ──────────────────────────────────────────────────
  # app-api runs prisma migrate deploy on every start — safe and idempotent.
  app-api:
    build:
      context: .
      dockerfile: apps/app-api/Dockerfile
    container_name: zapier_app_api
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/zapier_clone
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    command: >
      sh -c "
        npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma &&
        node apps/app-api/dist/server.js
      "
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  hooks-api:
    build:
      context: .
      dockerfile: apps/hooks-api/Dockerfile
    container_name: zapier_hooks_api
    restart: unless-stopped
    ports:
      - '3002:3002'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/zapier_clone
      NODE_ENV: production
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3002/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  relay:
    build:
      context: .
      dockerfile: apps/relay/Dockerfile
    container_name: zapier_relay
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/zapier_clone
      KAFKA_BROKERS: kafka:9092
      NODE_ENV: production
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3003/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: zapier_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/zapier_clone
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      NODE_ENV: production
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3004/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  postgres_data:
