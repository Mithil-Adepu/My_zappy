
# NOTE: The 'web' (Next.js) service is included here for single-command
# full-stack deployment. In production it can also be deployed to Vercel.

services:
  # ─── Infrastructure ────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: zapier_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zapier_clone
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: zapier_redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Kafka in KRaft mode — no Zookeeper
  # IMPORTANT: Two listeners are required for Docker networking:
  #   INTERNAL  — used by relay/worker containers (kafka:9092)
  #   EXTERNAL  — used by host-side tooling & dev services (localhost:9093)
  kafka:
    image: apache/kafka:3.7.0
    container_name: zapier_kafka
    ports:
      - '9093:9093'   # Expose EXTERNAL listener to host for dev services
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9093,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 15s
      retries: 15
      start_period: 30s

  # ─── One-shot topic initialiser ───────────────────────────────────────────
  # Creates the Kafka topic before any app service starts.
  # restart: no ensures this only runs once per `docker compose up`.
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: zapier_kafka_init
    restart: 'no'
    command: >
      sh -c "
        echo 'Waiting for Kafka to be ready...' &&
        sleep 10 &&
        /opt/kafka/bin/kafka-topics.sh
          --bootstrap-server kafka:9092
          --create
          --if-not-exists
          --topic zap.run.requested
          --partitions 4
          --replication-factor 1 &&
        echo 'Topic zap.run.requested ready.'
      "
    depends_on:
      kafka:
        condition: service_healthy

  # ─── Application Services ──────────────────────────────────────────────────
  # app-api runs prisma migrate deploy + seed on every start — both are idempotent.
  app-api:
    build:
      context: .
      dockerfile: apps/app-api/Dockerfile
    container_name: zapier_app_api
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/zapier_clone
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    command: >
      sh -c "
        node_modules/.bin/prisma migrate deploy --schema=packages/db/prisma/schema.prisma &&
        node dist/server.js
      "
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  hooks-api:
    build:
      context: .
      dockerfile: apps/hooks-api/Dockerfile
    container_name: zapier_hooks_api
    restart: unless-stopped
    ports:
      - '3002:3002'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/zapier_clone
      NODE_ENV: production
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3002/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  relay:
    build:
      context: .
      dockerfile: apps/relay/Dockerfile
    container_name: zapier_relay
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/zapier_clone
      KAFKA_BROKERS: kafka:9092
      NODE_ENV: production
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3003/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: zapier_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/zapier_clone
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      NODE_ENV: production
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3004/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: zapier_web
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_HOOKS_URL: http://localhost:3002
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      app-api:
        condition: service_healthy

volumes:
  postgres_data:
