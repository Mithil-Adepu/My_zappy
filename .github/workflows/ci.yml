name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @zapier-clone/db generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zapier_clone_ci

      - name: Run worker unit tests
        run: pnpm --filter @zapier-clone/worker test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zapier_clone_ci
          REDIS_URL: redis://localhost:6379
          ENCRYPTION_KEY: "0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20"
          NODE_ENV: test

      - name: Run hooks-api unit tests
        run: pnpm --filter @zapier-clone/hooks-api test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zapier_clone_ci
          NODE_ENV: test

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @zapier-clone/db generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fake

      - name: Typecheck all packages
        run: pnpm --filter "@zapier-clone/*" lint

  integration-tests:
    name: Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    # Testcontainers spins its own Docker containers — needs Docker socket
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @zapier-clone/db generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fake

      - name: Run integration tests (claim + outbox SKIP LOCKED)
        run: pnpm --filter "@zapier-clone/worker" test:integration
        env:
          ENCRYPTION_KEY: "0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20"
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          # DATABASE_URL is set by Testcontainers at runtime — no static value needed

  playwright-e2e:
    name: Playwright Frontend E2E
    runs-on: ubuntu-latest
    needs: [unit-tests]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zapier_clone_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      - name: Generate Prisma client
        run: pnpm --filter @zapier-clone/db generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zapier_clone_ci

      - name: Apply migrations and seed
        run: |
          pnpm --filter @zapier-clone/db db:migrate
          pnpm --filter @zapier-clone/db db:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zapier_clone_ci

      - name: Start app-api in background
        run: pnpm --filter @zapier-clone/app-api start &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zapier_clone_ci
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-jwt-secret-32-chars-minimum
          ENCRYPTION_KEY: "0102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f20"
          PORT: 3001
          NODE_ENV: test

      - name: Wait for app-api
        run: npx wait-on http://localhost:3001/health --timeout 30000

      - name: Start Next.js in background
        run: pnpm --filter @zapier-clone/web dev &
        env:
          NEXT_PUBLIC_APP_API_URL: http://localhost:3001
          NODE_ENV: test

      - name: Wait for Next.js
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Playwright tests
        run: pnpm --filter @zapier-clone/web test:e2e
        env:
          WEB_URL: http://localhost:3000
          NEXT_PUBLIC_APP_API_URL: http://localhost:3001

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

